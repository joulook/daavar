name: bump-submodules
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Move each submodule to the newest commit of its branch
        run: |
          git submodule update --init --remote
          if git diff --quiet; then echo "Submodules up to date"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg=$(git submodule foreach --quiet 'echo "$name $(git rev-parse --short HEAD)"' | paste -sd ', ')
          git commit -am "Bump submodules: $msg"
          git push
