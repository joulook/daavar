name: bump-submodules
on:
  # manual only during the evaluation (2026-10-30 → 11-14): the pins are frozen and move only by
  # the owner's decision after validation; re-enable the schedule afterwards
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Move each submodule to the newest commit of its branch
        run: |
          # The checkout fetches each submodule shallowly at its pinned commit, so the
          # tracked branch is not known yet: fetch it explicitly, then move to it.
          git submodule foreach 'b=$(git config -f "$toplevel/.gitmodules" submodule."$name".branch); git fetch --depth 1 origin "$b" && git checkout -q FETCH_HEAD'
          if git diff --quiet; then echo "Submodules up to date"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg=$(git submodule foreach --quiet 'echo "$name $(git rev-parse --short HEAD)"' | paste -sd ', ')
          git commit -am "Bump submodules: $msg"
          git push
