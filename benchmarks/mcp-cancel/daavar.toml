name = "mcp-cancel"
model = "fifo"

[programs.spec]
kind = "spec"
lang = "rust"
side = "spec"
args = ["spec", "{variant}", "{reading}", "{c2.flag}"]

# imp.rs ignores the reading (server(.., _args)); "s0" only holds the position for c2
[programs.rust]
kind = "impl"
lang = "rust"
side = "impl"
args = ["impl", "{variant}", "{c2.reading}", "{c2.flag}"]

[programs.java]
kind = "impl"
lang = "java"
class = "bench.mcp_cancel.McpCancel"
args = ["impl", "{variant}"]

# the mutants run spec::server and read the reading
[programs.mutant1]
kind = "mutant"
reference = "spec"
lang = "rust"
side = "impl"
args = ["mutant1", "{variant}", "{reading}", "{c2.flag}"]

[programs.mutant2]
kind = "mutant"
reference = "spec"
lang = "rust"
side = "impl"
args = ["mutant2", "{variant}", "{reading}", "{c2.flag}"]

[programs.mutant3]
kind = "mutant"
reference = "spec"
lang = "rust"
side = "impl"
args = ["mutant3", "{variant}", "{reading}", "{c2.flag}"]

# ---- pairs: both twins, no cancel of request 2
[scenarios.pairs]
visible = ["client", "server"]
programs = ["spec", "rust", "java", "mutant1", "mutant2", "mutant3"]
c2 = { reading = "", flag = "" }
directions = ["rust<=spec", "java<=spec", "java<=rust", "rust<=java",
              "mutant1<=spec", "mutant2<=spec", "mutant3<=spec"]

[scenarios.pairs.matrix]
variant = ["aa", "ab", "ax", "ba", "bb", "bx", "ca", "cb", "cx", "xa", "xb", "xx"]
reading = ["s0", "s1", "s2", "s3"]
label = "{variant}.{reading}"

# ---- pairs-c2: the client may also cancel request 2; Rust only (McpCancel does not offer it)
[scenarios.pairs-c2]
visible = ["client", "server"]
programs = ["spec", "rust", "mutant1", "mutant2", "mutant3"]
c2 = { reading = "s0", flag = "c2" }
directions = ["rust<=spec", "mutant1<=spec", "mutant2<=spec", "mutant3<=spec"]

[scenarios.pairs-c2.matrix]
variant = ["aa", "ab", "ax", "ba", "bb", "bx", "ca", "cb", "cx", "xa", "xb", "xx"]
reading = ["s0", "s1", "s2", "s3"]
label = "{variant}.{reading}.c2"

[check]
mode = "offline"
decide_budget = 1000000
witness_limit = 20
witness_nearest = 3
merge = false
threads = 1
seed = 1

[budgets]
export_timeout_s = 3600
join_timeout_s = 3600
java_xmx = "16g"
mem_cap_gb = 0

[vocab]
opaque = ["ErrCode"]

[tools]
traceforge = "../../traceforge"

[tools.jmc]
checkout = "../../jmc"
cli = "positional"
main = "org.mpi_sws.jmc.mp.launch.MpLauncher"
api_package = "org.mpi_sws.jmc.mp.launch"
